name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 1) Build the static SPA web output FIRST (must land in ./dist == webDir).
      - name: Build web app
        run: npm run build:mobile

      - name: Verify web output matches webDir
        run: |
          test -f dist/index.html || { echo "dist/index.html missing — webDir mismatch"; exit 1; }
          ls -la dist

      # 2) Then sync into the native project.
      - name: Add Android platform
        run: npx cap add android || echo "android platform already present"

      - name: Capacitor sync
        run: npx cap sync android

      # 3) Debug build only — no keystore, no signing config.
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: assan-khata-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
