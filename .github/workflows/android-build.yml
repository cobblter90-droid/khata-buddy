name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Environment info
        run: |
          node -v && npm -v && java -version

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 1) Build the static SPA web output FIRST — must land in .output/public (== webDir).
      - name: Build web app
        run: npm run build:mobile
        env:
          CI: "true"
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify web output matches webDir in capacitor.config.ts
        run: |
          WEBDIR=$(node -e "const s=require('fs').readFileSync('capacitor.config.ts','utf8');console.log(/webDir:\s*[\"']([^\"']+)[\"']/.exec(s)[1])")
          echo "webDir = $WEBDIR"
          test -f "$WEBDIR/index.html" || { echo "::error::$WEBDIR/index.html missing — web build output does not match webDir"; exit 1; }
          ls -la "$WEBDIR"

      # 2) Native project + icons/splash, then sync.
      - name: Add Android platform
        run: npx cap add android || echo "android platform already present"

      - name: Generate launcher icons and splash screens
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#22262E' --iconBackgroundColorDark '#22262E' --splashBackgroundColor '#22262E' --splashBackgroundColorDark '#22262E'

      - name: Verify launcher icons were generated
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            f="android/app/src/main/res/mipmap-$d/ic_launcher.png"
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
            echo "$f -> $(stat -c%s "$f") bytes"
          done

      - name: Capacitor sync
        run: npx cap sync android

      # 3) Debug build only — no keystore, no release signingConfig.
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: assan-khata-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
