name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Environment info
        run: |
          node -v && npm -v && java -version

      # STABLE SIGNING KEY — the committed keystore replaces the random one
      # Android would otherwise generate per build. Same certificate on every
      # run == APK installs as an update in place, no uninstall, no data loss.
      - name: Install committed debug keystore
        run: |
          test -f android-resources/debug.keystore || { echo "::error::android-resources/debug.keystore missing"; exit 1; }
          mkdir -p ~/.android
          cp android-resources/debug.keystore ~/.android/debug.keystore
          echo "keystore sha256: $(sha256sum android-resources/debug.keystore | cut -d' ' -f1)"
          keytool -list -v -keystore android-resources/debug.keystore -storepass android | grep -E "Alias name|SHA256:"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 1) Build the static SPA web output FIRST — must land in .output/public (== webDir).
      - name: Build web app
        run: npm run build:mobile
        env:
          CI: "true"
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify web output matches webDir in capacitor.config.ts
        run: |
          WEBDIR=$(node -e "const s=require('fs').readFileSync('capacitor.config.ts','utf8');console.log(/webDir:\s*[\"']([^\"']+)[\"']/.exec(s)[1])")
          echo "webDir = $WEBDIR"
          test -f "$WEBDIR/index.html" || { echo "::error::$WEBDIR/index.html missing — web build output does not match webDir"; exit 1; }
          ls -la "$WEBDIR"

      # 2) Native project + icons/splash, then sync.
      - name: Add Android platform
        run: npx cap add android || echo "android platform already present"

      - name: Generate launcher icons and splash screens
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#22262E' --iconBackgroundColorDark '#22262E' --splashBackgroundColor '#22262E' --splashBackgroundColorDark '#22262E'

      - name: Verify launcher icons were generated
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            f="android/app/src/main/res/mipmap-$d/ic_launcher.png"
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
            echo "$f -> $(stat -c%s "$f") bytes"
          done

      - name: Capacitor sync
        run: npx cap sync android

      # READ_CONTACTS is a runtime permission: it must exist in the merged
      # manifest or the in-app prompt is never shown on a real device.
      - name: Ensure READ_CONTACTS permission in AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_CONTACTS' "$MANIFEST" || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_CONTACTS" />\n</manifest>#' "$MANIFEST"
          grep -n 'READ_CONTACTS' "$MANIFEST" || { echo "::error::READ_CONTACTS missing"; exit 1; }

      # Version stamp comes from the single source of truth in the source code.
      - name: Stamp versionName / versionCode from APP_VERSION
        run: |
          VERSION=$(node -e "const s=require('fs').readFileSync('src/lib/constants.ts','utf8');console.log(/APP_VERSION\s*=\s*[\"']([^\"']+)[\"']/.exec(s)[1])")
          echo "APP_VERSION = $VERSION"
          IFS=. read -r MA MI PA <<< "$VERSION"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "versionCode = $CODE"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      # Point the debug signingConfig at the committed keystore explicitly, so
      # the build never falls back to a freshly generated one.
      - name: Pin debug signingConfig to committed keystore
        run: |
          cp android-resources/debug.keystore android/app/debug.keystore
          node - <<'JS'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes('assanDebugKeystore')) {
            const cfg = `    signingConfigs {\n        debug {\n            // assanDebugKeystore: stable committed key — do not regenerate\n            storeFile file('debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n`;
            s = s.replace(/android\s*\{/, (m) => m + '\n' + cfg);
            s = s.replace(/buildTypes\s*\{\s*/, (m) => m + '\n        debug {\n            signingConfig signingConfigs.debug\n        }\n');
            fs.writeFileSync(p, s);
          }
          console.log(s);
          JS

      # 3) Debug build only — signed with the stable committed keystore.
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # Verification only — never fail the build. Modern APKs are signed with
      # v2/v3 scheme only, so `keytool -printcert -jarfile` (v1/JAR signatures)
      # often finds nothing; apksigner is the correct tool.
      - name: Print APK signing certificate (must be identical across runs)
        continue-on-error: true
        run: |
          set +e
          APK=$(ls -1 android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1)
          if [ -z "$APK" ]; then
            echo "::warning::no debug APK found to inspect — skipping certificate print"
            exit 0
          fi
          echo "APK: $APK"

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -n "$APKSIGNER" ]; then
            echo "--- apksigner ---"
            "$APKSIGNER" verify --print-certs "$APK" | grep -Ei "Signer #1 certificate (DN|SHA-256)" \
              || echo "::warning::apksigner could not print certificates"
          else
            echo "::warning::apksigner not found in ANDROID_HOME/build-tools"
          fi

          echo "--- keytool (v1/JAR signature, may be absent) ---"
          keytool -printcert -jarfile "$APK" 2>/dev/null | grep -E "Owner|SHA256:" \
            || echo "::warning::keytool found no JAR (v1) signature — expected for v2/v3-only APKs"

          echo "--- expected fingerprint from committed keystore ---"
          keytool -list -v -keystore android-resources/debug.keystore -storepass android | grep "SHA256:" \
            || echo "::warning::could not read committed keystore fingerprint"
          exit 0


      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: assan-khata-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
